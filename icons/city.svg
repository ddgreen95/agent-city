<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A0533"/><stop offset=".62" stop-color="#090218"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <radialGradient id="sun" cx="32" cy="34" r="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".75"/><stop offset=".6" stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <linearGradient id="tw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1145"/><stop offset="1" stop-color="#0A0620"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <circle cx="32" cy="34" r="20" fill="url(#sun)"/>
    <!-- perspective grid floor -->
    <g stroke="#FF2BD6" stroke-width="1" opacity=".75">
      <line x1="0" y1="49" x2="64" y2="49"/><line x1="0" y1="53" x2="64" y2="53"/><line x1="0" y1="58.5" x2="64" y2="58.5"/>
      <line x1="32" y1="49" x2="32" y2="64"/><line x1="24" y1="49" x2="12" y2="64"/><line x1="40" y1="49" x2="52" y2="64"/>
      <line x1="16" y1="49" x2="-8" y2="64"/><line x1="48" y1="49" x2="72" y2="64"/>
    </g>
    <!-- skyline, neon outlines -->
    <g filter="url(#glow)" stroke-linejoin="round">
      <path d="M8 49 V31 h9 V49" fill="url(#tw)" stroke="#22D3EE" stroke-width="2"/>
      <path d="M46 49 V27 h10 V49" fill="url(#tw)" stroke="#22D3EE" stroke-width="2"/>
      <path d="M24 49 V16 l8-6 l8 6 V49" fill="url(#tw)" stroke="#FF2BD6" stroke-width="2.4"/>
    </g>
    <!-- windows -->
    <g fill="#22D3EE"><rect x="11" y="35" width="3" height="2"/><rect x="11" y="41" width="3" height="2"/><rect x="49.5" y="31" width="3" height="2"/><rect x="49.5" y="38" width="3" height="2"/></g>
    <g fill="#FF8AF0"><rect x="28" y="20" width="8" height="2"/><rect x="28" y="27" width="8" height="2"/><rect x="28" y="34" width="8" height="2"/><rect x="28" y="41" width="8" height="2"/></g>
    <!-- antenna beacon -->
    <line x1="32" y1="10" x2="32" y2="4" stroke="#FF2BD6" stroke-width="1.6"/>
    <circle cx="32" cy="4" r="2.2" fill="#FFFFFF" filter="url(#glow)"/>
  </g>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.3" fill="none" stroke="#FF2BD6" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
